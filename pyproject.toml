[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "wawet"
version = "0.1.0"
description = "Experimental transport-independent road events and vehicle simulator"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Hathorsoft Ltd"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.13.3", "mypy==2.3.1"]

[project.scripts]
wawet-demo = "wawet.demo:main"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/wawet"]
